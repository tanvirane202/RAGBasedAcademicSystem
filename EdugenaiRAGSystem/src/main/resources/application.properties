spring.application.name=EdugenaiRAGSystem
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=<>
spring.datasource.username=<>
spring.datasource.password=<>

spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.ai.google.genai.api-key=<>
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.embedding.api-key=<>

spring.ai.model.chat=openai

spring.ai.openai.api-key=<>

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.model.embedding=google-genai
server.port=8082

# Qdrant
spring.ai.vectorstore.qdrant.host=<>
spring.ai.vectorstore.qdrant.port=<>
spring.ai.vectorstore.qdrant.api-key=<>

spring.ai.vectorstore.qdrant.collection-name=edugenai_documents
spring.ai.vectorstore.qdrant.use-tls=true
spring.ai.vectorstore.qdrant.initialize-schema=false
